[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "prscore"
version = "0.1.0"
description = "PR Risk Scorer — just-in-time software defect prediction CLI"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"  # system has 3.12
dependencies = [
    "pydriller==2.6",
    "GitPython==3.1.43",
    "pandas==2.2.2",
    "numpy==1.26.4",
    "scikit-learn==1.5.0",
    "typer==0.12.3",
    "rich",
    "python-dotenv==1.0.1",
    "pydantic==2.7.1",
    "fastapi==0.111.0",
    "uvicorn==0.30.1",
]

[project.scripts]
prscore = "cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cli*", "features*", "models*", "rag*", "explain*", "api*", "eval*"]

[tool.black]
line-length = 99
target-version = ["py311"]

[tool.ruff]
line-length = 99
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
